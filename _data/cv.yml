      la transferencia cross-lingüe distribuida, aceptado en Findings of EMNLP 2026.
  - en: 'Lead its direct continuation, studying when to stop cross-lingual realignment:
      more realignment is not always better for transfer, and low-resource languages
      offer no labeled data to tell when to stop; paper under review at ACL Rolling
      Review (ARR).'
    es: 'Liderar su continuación directa, estudiando cuándo detener el realineamiento
      cross-lingüe: más realineamiento no siempre mejora la transferencia, y las lenguas
      de bajos recursos no ofrecen datos etiquetados para saber cuándo parar; artículo
      en revisión en ACL Rolling Review (ARR).'
  - en: 'Co-develop M2-ALIGN, studying where multilingual alignment should live in
      vision-language models: how to extend visual grounding to 11 languages, including
      low-resource ones, without eroding the multilingual reasoning the base models
      already have; ongoing work on culturally grounded evaluation (CVQA).'
    es: 'Co-desarrollar M2-ALIGN, estudiando dónde debe vivir el alineamiento multilingüe
      en los modelos de visión y lenguaje: cómo extender el grounding visual a 11
      lenguas, incluidas lenguas de bajos recursos, sin erosionar el razonamiento
      multilingüe que los modelos base ya tienen; trabajo en curso sobre evaluación
      culturalmente situada (CVQA).'
